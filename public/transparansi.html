<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Keuangan - Masjid Al-Ghufron PNIC Blok G (RW 035)</title>
<link rel="icon" href="/favicon.jpg" type="image/jpeg">
<link rel="stylesheet" href="/style.css">
<style>
  body { background: var(--bg); }
  .pub-topbar {
    background: linear-gradient(135deg, var(--green-900), var(--green-700));
    color: white; padding: 22px 20px;
  }
  .pub-topbar .brand { max-width: 720px; margin: 0 auto; }
  .pub-wrap { max-width: 720px; margin: 0 auto; padding: 20px 20px 48px; }
  .pub-updated { text-align: center; font-size: 12px; color: var(--muted); margin: 14px 0 24px; }
  .pub-hero { text-align: center; padding: 28px 20px; }
  .pub-hero .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .pub-hero .value { font-size: 34px; font-weight: 700; color: var(--green-900); }
  .trend-table th, .trend-table td { text-align: right; }
  .trend-table th:first-child, .trend-table td:first-child { text-align: left; }
  .footer-note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--muted); }
</style>
</head>
<body>

<div class="pub-topbar">
  <div class="brand">
    <span class="brand-icon">☾</span>
    <div>
      <h1 id="pub-title">Masjid Al-Ghufron PNIC Blok G (RW 035)</h1>
      <p>Laporan Keuangan Masjid</p>
    </div>
  </div>
</div>

<div class="pub-wrap" id="pub-content">
  <div class="loading">Memuat data...</div>
</div>

<script>
const fmtMoney = (n) => 'Rp ' + new Intl.NumberFormat('id-ID').format(Math.round(n || 0));

function fmtUpdated(iso) {
  const d = new Date(iso);
  return d.toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });
}

async function load() {
  const content = document.getElementById('pub-content');
  try {
    const res = await fetch('/api/public/summary');
    if (!res.ok) throw new Error('Gagal memuat data');
    const d = await res.json();

    const accountCards = d.accounts.map((a) => `
      <div class="card stat-card">
        <div class="label">${a.name} (${a.type === 'tunai' ? 'Tunai' : 'Bank'})</div>
        <div class="value" style="font-size:18px">${fmtMoney(a.saldo)}</div>
        <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:13px; display:flex; flex-direction:column; gap:5px;">
          <div style="display:flex; justify-content:space-between; gap:8px;"><span style="color:var(--muted); white-space:nowrap;">Kas Operasional</span><span style="${a.saldoOperasional < 0 ? 'color:var(--danger)' : ''}">${fmtMoney(a.saldoOperasional)}</span></div>
          <div style="display:flex; justify-content:space-between; gap:8px;"><span style="color:var(--muted); white-space:nowrap;">Dana Pembangunan</span><span style="${a.saldoPembangunan < 0 ? 'color:var(--danger)' : ''}">${fmtMoney(a.saldoPembangunan)}</span></div>
        </div>
      </div>`).join('');

    const trendRowsOf = (rows) => rows.map((t) => `
      <tr>
        <td>${t.label}</td>
        <td class="amount in">${fmtMoney(t.masuk)}</td>
        <td class="amount out">${fmtMoney(t.keluar)}</td>
        <td>${fmtMoney(t.saldoAkhir)}</td>
      </tr>`).join('');

    content.innerHTML = `
      <div class="card pub-hero">
        <div class="label">Total Saldo Kas Masjid Saat Ini</div>
        <div class="value">${fmtMoney(d.totalSaldo)}</div>
      </div>

      <div class="grid grid-4" style="margin-bottom:20px">
        ${accountCards}
      </div>

      <div class="section">
        <h2 class="section-title">Saldo per Kelompok Dana</h2>
        <div class="grid grid-4">
          <div class="card stat-card">
            <div class="label">Kas Operasional</div>
            <div class="value ${d.groupSaldo.operasional < 0 ? 'negative' : ''}" style="font-size:19px">${fmtMoney(d.groupSaldo.operasional)}</div>
          </div>
          <div class="card stat-card">
            <div class="label">Dana Pembangunan</div>
            <div class="value ${d.groupSaldo.pembangunan < 0 ? 'negative' : ''}" style="font-size:19px">${fmtMoney(d.groupSaldo.pembangunan)}</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">Ringkasan Minggu Ini (${d.weekLabel})</h2>
        <div class="grid grid-4">
          <div class="card stat-card">
            <div class="label">Pemasukan</div>
            <div class="value" style="font-size:19px">${fmtMoney(d.weekMasuk)}</div>
          </div>
          <div class="card stat-card">
            <div class="label">Pengeluaran</div>
            <div class="value negative" style="font-size:19px">${fmtMoney(d.weekKeluar)}</div>
          </div>
          <div class="card stat-card">
            <div class="label">Selisih</div>
            <div class="value ${d.weekMasuk - d.weekKeluar < 0 ? 'negative' : ''}" style="font-size:19px">${fmtMoney(d.weekMasuk - d.weekKeluar)}</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">Ringkasan Bulan Ini (${d.monthLabel})</h2>
        <div class="grid grid-4">
          <div class="card stat-card">
            <div class="label">Pemasukan</div>
            <div class="value" style="font-size:19px">${fmtMoney(d.monthMasuk)}</div>
          </div>
          <div class="card stat-card">
            <div class="label">Pengeluaran</div>
            <div class="value negative" style="font-size:19px">${fmtMoney(d.monthKeluar)}</div>
          </div>
          <div class="card stat-card">
            <div class="label">Selisih</div>
            <div class="value ${d.monthMasuk - d.monthKeluar < 0 ? 'negative' : ''}" style="font-size:19px">${fmtMoney(d.monthMasuk - d.monthKeluar)}</div>
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Kelompok Dana</th><th>Pemasukan</th><th>Pengeluaran</th><th>Selisih</th></tr></thead>
              <tbody>
                <tr>
                  <td>Kas Operasional</td>
                  <td class="amount in">${fmtMoney(d.monthByGroup.operasional.masuk)}</td>
                  <td class="amount out">${fmtMoney(d.monthByGroup.operasional.keluar)}</td>
                  <td class="amount ${d.monthByGroup.operasional.masuk - d.monthByGroup.operasional.keluar < 0 ? 'out' : 'in'}">${fmtMoney(d.monthByGroup.operasional.masuk - d.monthByGroup.operasional.keluar)}</td>
                </tr>
                <tr>
                  <td>Dana Pembangunan</td>
                  <td class="amount in">${fmtMoney(d.monthByGroup.pembangunan.masuk)}</td>
                  <td class="amount out">${fmtMoney(d.monthByGroup.pembangunan.keluar)}</td>
                  <td class="amount ${d.monthByGroup.pembangunan.masuk - d.monthByGroup.pembangunan.keluar < 0 ? 'out' : 'in'}">${fmtMoney(d.monthByGroup.pembangunan.masuk - d.monthByGroup.pembangunan.keluar)}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card section">
        <h2 class="section-title">Tren 6 Bulan Terakhir &mdash; Gabungan</h2>
        <div class="table-wrap">
          <table class="trend-table">
            <thead><tr><th>Bulan</th><th>Pemasukan</th><th>Pengeluaran</th><th>Saldo Akhir</th></tr></thead>
            <tbody>${trendRowsOf(d.trend)}</tbody>
          </table>
        </div>
      </div>

      <div class="card section">
        <h2 class="section-title">Tren 6 Bulan Terakhir &mdash; Kas Operasional</h2>
        <div class="table-wrap">
          <table class="trend-table">
            <thead><tr><th>Bulan</th><th>Pemasukan</th><th>Pengeluaran</th><th>Saldo Akhir</th></tr></thead>
            <tbody>${trendRowsOf(d.trendByGroup.operasional)}</tbody>
          </table>
        </div>
      </div>

      <div class="card section">
        <h2 class="section-title">Tren 6 Bulan Terakhir &mdash; Dana Pembangunan</h2>
        <div class="table-wrap">
          <table class="trend-table">
            <thead><tr><th>Bulan</th><th>Pemasukan</th><th>Pengeluaran</th><th>Saldo Akhir</th></tr></thead>
            <tbody>${trendRowsOf(d.trendByGroup.pembangunan)}</tbody>
          </table>
        </div>
      </div>

      <p class="footer-note">
        Data diperbarui otomatis · Terakhir diperbarui: ${fmtUpdated(d.updatedAt)}<br>
        Laporan ini bersifat ringkasan untuk transparansi jamaah. Untuk rincian transaksi, silakan hubungi bendahara masjid.
      </p>
    `;
  } catch (err) {
    content.innerHTML = `<div class="loading">Gagal memuat data: ${err.message}</div>`;
  }
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
